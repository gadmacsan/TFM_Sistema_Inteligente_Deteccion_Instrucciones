x-flink-common: &flink-common
  image: tfm-flink:1.20
  profiles: ["flink"]
  volumes:
    - ./flink/jobs:/opt/job/jobs:ro
    - ./schema_v1.py:/opt/job/schema_v1.py:ro
    - ./models:/opt/job/models:ro
  environment:
    PYTHONPATH: /opt/job
    FLINK_PROPERTIES: |
      jobmanager.rpc.address: jobmanager
      taskmanager.numberOfTaskSlots: 2
      python.client.executable: python3
      python.executable: python3

services:
  kafka:
    image: apache/kafka:latest
    hostname: kafka
    container_name: kafka-demo
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:19092,CONTROLLER://kafka:19093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  # --- Flink (opcional): docker compose --profile flink up -d --build ---
  jobmanager:
    <<: *flink-common
    build: ./flink
    container_name: flink-jobmanager
    command: jobmanager
    ports:
      - "8081:8081"   # Web UI de Flink
    depends_on:
      - kafka

  taskmanager:
    <<: *flink-common
    container_name: flink-taskmanager
    command: taskmanager
    depends_on:
      - jobmanager
